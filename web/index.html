<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/cores_black_icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cores" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icons/icon-180.png" />
    <title>Cores</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const localHost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname)
        if (localHost || !('serviceWorker' in navigator)) return

        let reloading = false
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (reloading) return
          reloading = true
          window.location.reload()
        })

        navigator.serviceWorker
          .register('/sw.js?v=3', { scope: '/', updateViaCache: 'none' })
          .then(async (registration) => {
            registration.waiting?.postMessage({ type: 'SKIP_WAITING' })
            await registration.update()
          })
          .catch((error) => console.error('Cores service worker upgrade failed:', error))
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
